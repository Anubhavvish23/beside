<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Beside</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0c0e; color: #f3f3f3; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    .mic { position: fixed; inset: auto 12px 12px 12px; display: none; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: #101114; border: 1px solid rgba(56,189,248,0.4); box-shadow: 0 16px 40px rgba(0,0,0,0.45); font-size: 13px; line-height: 1.4; }
    .mic.show { display: flex; }
    .mic button { all: unset; cursor: pointer; white-space: nowrap; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 8px; background: #00c2ff; color: #000; }
  </style>
</head>
<body>
  <iframe id="board" allow="microphone; autoplay; clipboard-write"></iframe>
  <div class="mic" id="mic">
    <span>Beside needs your microphone once to hear you in the sidebar.</span>
    <button id="allow">Allow mic</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
