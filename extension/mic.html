<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Beside · microphone</title>
  <style>
    html, body { margin: 0; height: 100%; display: grid; place-items: center; background: #0b0c0e; color: #f3f3f3; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { max-width: 420px; padding: 28px; border-radius: 18px; background: #101114; border: 1px solid rgba(255,255,255,0.1); text-align: center; line-height: 1.5; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0; color: rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Allow the microphone</h1>
    <p id="body">Click Allow in Chrome's prompt so Beside can hear you from the sidebar.</p>
  </div>
  <script src="mic.js"></script>
</body>
</html>
